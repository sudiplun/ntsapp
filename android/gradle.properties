org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
android.enableJetifier=true
kotlin.jvm.target.validation.mode = IGNORE
# Built-in Kotlin is required for AGP 9 and for plugins that rely on it.
#
# It also keeps workmanager_android off the Kotlin Gradle Plugin: the plugin
# only applies KGP when AGP is older than 9 or when built-in Kotlin is off.
# Flutter still prints "workmanager_android applies KGP" for every build -
# that check is a static text scan of the plugin's build.gradle and cannot
# see the condition. The plugin does not apply KGP here.
android.builtInKotlin=true
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false
